name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      cli-released: ${{ steps.release.outputs['packages/cli--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish-cli:
    needs: release-please
    if: needs.release-please.outputs.cli-released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stateofpixel test
      - run: pnpm --filter stateofpixel build
      - run: npm publish --access public
        working-directory: packages/cli
