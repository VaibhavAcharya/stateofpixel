name: Visual

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  playground:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stateofpixel build
      - id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-${{ runner.os }}-
      - run: mkdir -p ~/apt-cache && find ~/apt-cache -name "*.deb" -exec sudo cp -t /var/cache/apt/archives {} +
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @stateofpixel/playground exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @stateofpixel/playground exec playwright install-deps chromium
      - run: find /var/cache/apt/archives -name "*.deb" -exec cp -t ~/apt-cache {} +
      - run: pnpm --filter @stateofpixel/playground capture
      - run: node packages/cli/dist/index.mjs upload examples/playground/screenshots --build-name playground
      - run: pnpm --filter @stateofpixel/playground build-storybook
      - run: node packages/cli/dist/index.mjs storybook examples/playground/storybook-static --build-name storybook

  web:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stateofpixel build
      - id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-${{ runner.os }}-
      - run: mkdir -p ~/apt-cache && find ~/apt-cache -name "*.deb" -exec sudo cp -t /var/cache/apt/archives {} +
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @stateofpixel/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @stateofpixel/web exec playwright install-deps chromium
      - run: find /var/cache/apt/archives -name "*.deb" -exec cp -t ~/apt-cache {} +
      - run: pnpm --filter @stateofpixel/web visual --shard ${{ matrix.shard }}/2

  web-storybook:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stateofpixel build
      - id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-${{ runner.os }}-
      - run: mkdir -p ~/apt-cache && find ~/apt-cache -name "*.deb" -exec sudo cp -t /var/cache/apt/archives {} +
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @stateofpixel/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @stateofpixel/web exec playwright install-deps chromium
      - run: find /var/cache/apt/archives -name "*.deb" -exec cp -t ~/apt-cache {} +
      - run: pnpm --filter @stateofpixel/web build-storybook
      - run: node packages/cli/dist/index.mjs storybook apps/web/storybook-static --build-name web-storybook --viewports 375,1280 --delay 300 --shard ${{ matrix.shard }}/3
