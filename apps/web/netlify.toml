[build]
  command = "pnpm --filter @stateofpixel/web build && node apps/web/scripts/stage-migrations.ts"
  publish = "apps/web/dist/client"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[functions]
  node_bundler = "esbuild"

[db.migrations]
  path = "netlify/database/migrations"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
