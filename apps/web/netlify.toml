[build]
  command = "pnpm --filter @stateofpixel/web build && node apps/web/scripts/stage-migrations.ts"
  publish = "apps/web/dist/client"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[functions]
  directory = "netlify/functions"

[functions."jobs-tick"]
  schedule = "* * * * *"

[functions."sync-checks"]
  schedule = "*/5 * * * *"

[functions."delete-old-builds"]
  schedule = "30 3 * * *"

[functions."collect-images"]
  schedule = "0 4 * * *"

[functions."cleanup-events"]
  schedule = "30 4 * * *"

[functions."count-usage"]
  schedule = "0 5 * * *"

[db.migrations]
  path = "netlify/database/migrations"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
