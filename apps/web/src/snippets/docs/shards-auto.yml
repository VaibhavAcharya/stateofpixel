jobs:
  visual:
    # ... each job ends with:
    steps:
      - run: npx stateofpixel upload screenshots --shard auto

  finalize:
    needs: visual
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npx stateofpixel finalize --skip-if-empty
