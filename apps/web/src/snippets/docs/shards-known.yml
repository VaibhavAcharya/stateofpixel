jobs:
  visual:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard ${{ matrix.shard }}/4
      - run: npx stateofpixel upload screenshots --shard ${{ matrix.shard }}/4
